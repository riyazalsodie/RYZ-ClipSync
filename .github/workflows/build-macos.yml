name: Build macOS Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach macOS assets to (e.g. v1.1.0)'
        required: true
        default: 'v1.1.0'
  release:
    types: [published]
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build macOS Application (.dmg and .zip)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --mac dmg zip --x64 --arm64 -p never

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET_TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TARGET_TAG" ]; then
            TARGET_TAG="${{ github.ref_name }}"
          fi
          echo "Uploading macOS build to release: $TARGET_TAG"
          gh release upload "$TARGET_TAG" dist/*.dmg dist/*.zip --clobber
