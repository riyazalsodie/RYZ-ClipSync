<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="tray.css">
</head>

<body>
    <div class="tray-container">
        <div class="menu-item action-open">
            <span class="icon">
                <svg viewBox="0 0 24 24">
                    <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" />
                    <rect x="8" y="2" width="8" height="4" rx="1" />
                </svg>
            </span>
            <span class="label">Open RYZ ClipSync</span>
            <span class="shortcut">Ctrl+Shift+V</span>
        </div>
        <div class="menu-item action-copy-latest">
            <span class="icon">
                <svg viewBox="0 0 24 24">
                    <rect x="9" y="9" width="13" height="13" rx="2" />
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
                </svg>
            </span>
            <span class="label">Copy Latest Item</span>
        </div>

        <div class="divider"></div>

        <div class="section-title">RECENT CLIPS</div>
        <div id="recent-items-list">
            <!-- Recent items will be injected here -->
        </div>

        <div class="divider"></div>

        <div class="menu-item action-toggle-monitoring">
            <span class="icon" id="monitoring-icon">
                <svg class="ic-pause" viewBox="0 0 24 24">
                    <rect x="6" y="5" width="4" height="14" rx="1" />
                    <rect x="14" y="5" width="4" height="14" rx="1" />
                </svg>
                <svg class="ic-play" viewBox="0 0 24 24">
                    <path d="M7 4.5v15a1 1 0 0 0 1.53.85l12-7.5a1 1 0 0 0 0-1.7l-12-7.5A1 1 0 0 0 7 4.5z" />
                </svg>
            </span>
            <span class="label" id="monitoring-text">Pause Monitoring</span>
        </div>
        <div class="menu-item action-clear-history danger">
            <span class="icon">
                <svg viewBox="0 0 24 24">
                    <polyline points="3 6 5 6 21 6" />
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                    <line x1="10" y1="11" x2="10" y2="17" />
                    <line x1="14" y1="11" x2="14" y2="17" />
                </svg>
            </span>
            <span class="label">Clear All History</span>
        </div>
        <div class="menu-item action-toggle-startup">
            <span class="icon">
                <svg viewBox="0 0 24 24">
                    <path d="M21 12a9 9 0 1 1-2.64-6.36" />
                    <polyline points="21 3 21 9 15 9" />
                </svg>
            </span>
            <span class="label">Auto Startup</span>
            <input type="checkbox" id="startup-checkbox">
        </div>

        <div class="divider"></div>

        <div class="menu-item action-quit">
            <span class="icon">
                <svg viewBox="0 0 24 24">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                    <polyline points="16 17 21 12 16 7" />
                    <line x1="21" y1="12" x2="9" y2="12" />
                </svg>
            </span>
            <span class="label">Quit RYZ ClipSync</span>
        </div>
    </div>
    <script src="tray-renderer.js"></script>
</body>

</html>
